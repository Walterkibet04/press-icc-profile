[task]
name = "afterquery/press-icc-profile"

[metadata]
author_name = "Walter kibet"
author_email = "kibetwalter726@gmail.com"
difficulty_explanation = "Real-world task: a colour-management or prepress engineer builds a CMYK press profile from a measured test chart and turns the fitted press model into the A2B and B2A tables a RIP uses. The press is synthetic: a hidden spectral Yule-Nielsen Neugebauer model with dot gain, ink trapping, mild flare, and a strong effect the textbook model leaves out but real presses show, a dot gain of each ink that depends on how much of the other inks is printed. The chart was printed with uneven ink keys, so each ink's film thickness differs by up to about 9% across 8 zones. That shifts patches by several times the instrument noise, and by different amounts for solids, overprints and midtones. The data is realistic in kind, not in scale: 180 patches (real profiling charts have 900 to 1,600), about 0.26 CIEDE2000 of noise and 20 misreads, half of them only 2.5 to 4 units off. With so few patches the difficulty is structural. The zone drift has to be modelled as a change in each ink's absorption, and the cross-ink gain has to be found from residual patterns, while drift, misreads and the press's own nonlinearity look alike in the data. A model that misses either effect stays well above the forward limit however flexible it is. The inverse adds black generation, CIEDE2000 gamut clipping under a 300% ink limit, and lutAToB and lutBToA tables written byte by byte to a strict ICC v4 layout."
solution_explanation = "The reference fits a colour-space Yule-Nielsen modified Neugebauer model (15 free overprint primaries, one n-factor, per-ink dot-gain and skew, a per-ink coefficient for gain that depends on the other inks, a per-channel flare term t/(1-kt), and a film factor per ink and zone, constrained to average 1 per ink, that raises that ink's solid transmittance in every overprint primary to the power of the film factor) with a soft-L1 robust loss, drops patches that miss by more than 1.6 CIEDE2000 and refits, then adds a Gaussian-process residual. A2B1 is that model at film factor 1 (the sheet average) on a 17-point grid. B2A1 builds a 250,000-ink cloud, picks a start per Lab node with a smooth preferred black, refines every node with a batched Levenberg-Marquardt solver on CIEDE2000 components plus a black penalty and a hard-ish total-ink penalty, and stores it on a 33-point grid with a gamma 0.55 B curve on L to put more nodes in the shadows. The file is written as ICC v4 mAB and mBA. It runs in about 40 seconds."
verification_explanation = "tests/test_outputs.py reads /app/press.icc with a strict ICC parser and scores it with tests/press_model.py (the hidden sheet-average press) and fixed arrays in tests/hidden_points.npz. Seven tests; reward is 1 only if all pass; every test prints its scores. Only A2B1 is compared with the press: 2,000 inks drawn uniformly within 300%, mean at most 0.60 and 95th percentile at most 1.80. Every B2A1 check feeds the B2A1 output back through the submitted A2B1, so forward-model error is graded once. B2A1 limits: inverse A2B1(B2A1(t)) mean 0.65 and 95th percentile 1.80 on 1,264 printable colours stratified by lightness; total ink at most 300.5% on 3,500 dark and far out-of-gamut Lab values plus every colour of the other B2A1 checks; neutrals (14, L 14 to 92) within 1.0 with |a|,|b| at most 0.8; gamut excess at most 0.90 at the 95th percentile and 0.55 mean on 500 targets 1.5 to 4.0 CIEDE2000 outside the press gamut, where the best reachable colour is found at verify time on the submitted A2B1 (CIEDE2000 scan of a 200k-ink cloud within 300% plus a 9^4 grid, then projected Gauss-Newton from the best 4 starts; excess below 0 is clipped to 0); smoothness on 600 pairs exactly 1.5 apart, stratified by lightness, max channel jump 0.60 and at most 5% of pairs above 0.16. Gamut targets stop at about 4 outside because farther out CIEDE2000 has several minima and the score depends on which basin a solver lands in. The gamut p95 is the real check and the mean a backstop. Single large jumps in deep shadow are physical, so smoothness is graded mainly on the fraction of large jumps. The instruction states the lightness spread of the inverse and smoothness sets, because check pairs drawn from random inks (mostly very dark) and pairs drawn across Lab give large-jump fractions about 100 times apart. Forward calibration, all fitted to the shipped chart: models with zone films on density and cross-ink gain score 0.14 to 0.39 (the reference 0.309 as a model and 0.343/0.988 through its 17-point table; spectral models with free smooth absorbance spectra, free tone curves, per-overprint trapping and a GP residual 0.14 to 0.19, exact or pairwise cross-ink form; a pairwise cross-ink matrix in colour space 0.329; the reference without flare 0.346; drift as a per-zone scale on dot area instead of density 0.393). A perfect model through a 17-point table scores about 0.09. Failing: zones ignored 0.68, zones without cross-ink gain 1.82 even with all the flexible terms above. A free Lab offset per zone on top of the full press model scores 0.57 and passes narrowly; it finds the zones but not how drift acts on each colour. On a press with weaker cross-ink gain, independent solutions with the right structure scored up to 0.42 and those without cross-ink gain 0.54 to 0.67; the cross-ink gain was doubled from that version so that leaving it out costs far more than a loose fit of the right structure. B2A1 calibration on the same press with two independently written inverters: the reference's cloud-start Levenberg-Marquardt, and a UCR-style inverter that solves CMY first, moves the grey component to K, refines all four inks against the A2B1 table and also restarts every node from the best of a 150k-ink cloud. Correct inverses, 25 to 33 grid points, gamma or linear L curve, light to maximum black generation: inverse at most 0.54/1.46, neutrals at most 0.63 with |a|,|b| at most 0.45, gamut at most 0.19 mean and 0.79 p95, jump fraction at most 1.0%, max jump 0.24. Defective inverses fail at least one check by 21% or more: nearest-neighbour lookup without refinement (neutrals 2.09, gamut 0.64/1.69), 4 refinement iterations (neutrals 1.62, gamut p95 1.02), Euclidean-Lab clipping (gamut 0.67/1.60), no black preference (inverse p95 2.42), random per-node black (neutrals 8.8, jump fraction 6.0%), a 17-point grid (inverse 1.02/2.58, gamut p95 1.39), the UCR inverter without cloud restarts (gamut p95 1.27 to 3.16, it sticks in far local minima on out-of-gamut nodes). The reference passes every test (forward 0.343/0.988, inverse 0.35/1.01, neutrals 0.23, gamut 0.09/0.37, jumps 0.17 max and 0.7% above 0.16); the verifier takes about 60 to 110 seconds. Doing nothing scores 0."
category = "Media"
subcategory = "Design"
tags = ["color-management", "icc-profile", "prepress", "printing", "regression", "gamut-mapping", "press-calibration"]
expert_time_estimate_hours = 8
relevant_experience = "Prepress and colour-management work on printer characterisation: cleaning measurement data from a profiling chart, modelling a CMYK press with Neugebauer-style or smooth regression models, building the inverse Lab-to-CMYK table with black generation under a total-ink limit and a smooth gamut mapping, and writing ICC v4 output profiles with 4-D and 3-D lookup tables by hand."

